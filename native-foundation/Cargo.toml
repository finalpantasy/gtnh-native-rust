[workspace]
members = ["crates/voxel-core", "crates/residency", "crates/industrial-sim", "crates/quest-core", "crates/foundation-lab", "crates/foundation-viewer"]
default-members = ["crates/voxel-core", "crates/residency", "crates/industrial-sim", "crates/quest-core", "crates/foundation-lab"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
